url: https://dillonhammill.github.io/DataEditR/

template:
  bootstrap: 5
  bslib:
    primary: "#1D4ED8"
    navbar-light-brand-color: "#1E3A8A"
    base_font: "Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"

home:
  title: "DataEditR: interactive data editor for R"
  description: >
    View, enter, filter and edit data frames, files and database tables in an
    interactive spreadsheet-style editor, with undo, change review and
    reproducible code.

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    articles:
      text: Articles
      menu:
      - text: Editing database tables
        href: articles/databases.html
      - text: Using DataEditR in Shiny apps
        href: articles/shiny-modules.html
      - text: What's new in DataEditR 2.0
        href: articles/whats-new.html

reference:
- title: Interactive data editor
  desc: >
    `data_edit()` opens the data editor to view, enter, filter and edit data.
    It is also available from the RStudio `Addins` menu as
    *Interactive Data Editor*.
  contents:
  - data_edit

- title: Databases
  desc: >
    Edit tables stored in a database. Pass a `dbplyr` lazy table to
    `data_edit()`, or describe the table with `db_table()` when the key or the
    table to write to cannot be detected.
  contents:
  - db_table

- title: Code generation
  desc: >
    Generate tidyverse-style code that reproduces data edits using `dplyr`
    verbs.
  contents:
  - data_code

- title: Shiny modules
  desc: >
    Add the data editor to your own shiny applications with the `dataEdit`
    module. Save the changes (e.g. to a database) with `dataEditCommit()`,
    count unsaved changes with `dataEditChanges()` and get the change log
    with `dataEditLog()`.
  contents:
  - dataEdit
  - dataEditCommit

- title: Other shiny modules
  desc: >
    Modules for loading, filtering, selecting, synchronising and saving data
    that were combined in `data_edit()` before DataEditR 2.0. They can be
    combined with the `dataEdit` module in your own applications.
  contents:
  - dataInput
  - dataFilter
  - dataSelect
  - dataSync
  - dataOutput

articles:
- title: Articles
  navbar: ~
  contents:
  - DataEditR
  - databases
  - shiny-modules
  - whats-new
