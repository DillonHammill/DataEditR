# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# Coverage is uploaded with covr::codecov(). Without a CODECOV_TOKEN secret
# this relies on Codecov's legacy upload route, which accepts uploads from
# GitHub Actions in public repositories without a token. covr 4.0.0 moved to
# Codecov's new upload API, which needs a token except for pull requests from
# forks, so covr is kept at 3.6.5 here. Adding a CODECOV_TOKEN secret (from
# the repository's settings on codecov.io) makes the upload use it, after
# which `any::covr` can be used again. A failed upload only gives a warning:
# it must not fail the tests.
on:
  push:
    branches: [main, master]
  pull_request:

name: test-coverage.yaml

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: covr@3.6.5
          needs: coverage

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          # Tokenless uploads share a rate limit at Codecov, so wait and retry
          # when it is reached rather than losing the report.
          upload <- function() {
            tryCatch(covr::codecov(coverage = cov, quiet = FALSE),
                     error = function(e) list(error = conditionMessage(e)))
          }
          for (i in 1:4) {
            res <- upload()
            msg <- paste(unlist(res), collapse = " ")
            if (!grepl("rate limit", msg, ignore.case = TRUE)) break
            if (i < 4) {
              message("Codecov rate limit reached, retrying in 3 minutes")
              Sys.sleep(180)
            } else {
              cat("::warning::Codecov rate limit reached, coverage was not uploaded\n")
            }
          }
          print(res)
          if (!grepl("upload successfully", msg, ignore.case = TRUE)) {
            cat("::warning::Coverage was not uploaded to Codecov:", gsub("\n", " ", msg), "\n")
          }
        shell: Rscript {0}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
