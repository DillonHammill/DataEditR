# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# Coverage is uploaded with covr::codecov(), which needs no token for a public
# repository on GitHub Actions (Codecov checks the run with GitHub instead). The
# codecov-action needs a CODECOV_TOKEN secret to upload from a protected branch
# such as master. covr::codecov() uses CODECOV_TOKEN if one is ever added.
on:
  push:
    branches: [main, master]
  pull_request:

name: test-coverage.yaml

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr
          needs: coverage

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          # Tokenless uploads share a rate limit at Codecov, so wait and retry
          # when it is reached rather than losing the report.
          for (i in 1:4) {
            res <- covr::codecov(coverage = cov, quiet = FALSE)
            msg <- paste(unlist(res), collapse = " ")
            if (!grepl("rate limit", msg, ignore.case = TRUE)) break
            if (i < 4) {
              message("Codecov rate limit reached, retrying in 3 minutes")
              Sys.sleep(180)
            } else {
              cat("::warning::Codecov rate limit reached, coverage was not uploaded\n")
            }
          }
          print(res)
        shell: Rscript {0}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
